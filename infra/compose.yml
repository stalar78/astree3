name: astrea

x-backend-build: &backend-build
  context: ../backend
  dockerfile: Dockerfile

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
  PRIVATE_MEDIA_ROOT: /var/lib/astrea/private
  CANDIDATE_INTAKE_ENABLED: ${CANDIDATE_INTAKE_ENABLED:-false}

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrea}
      POSTGRES_USER: ${POSTGRES_USER:-astrea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - astrea-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
    volumes:
      - astrea-private-media:/var/lib/astrea/private
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys; from urllib.request import urlopen; data=json.loads(urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read().decode()); sys.exit(0 if data.get('status') == 'ok' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_CANDIDATE_FORM_ENABLED: ${VITE_CANDIDATE_FORM_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASTREA_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  astrea-postgres-data:
  astrea-private-media:
