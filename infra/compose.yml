name: astrea

x-backend-build: &backend-build
  context: ../backend
  dockerfile: Dockerfile

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
  PRIVATE_MEDIA_ROOT: /var/lib/astrea/private
  CANDIDATE_INTAKE_ENABLED: ${CANDIDATE_INTAKE_ENABLED:-false}
  ADMIN_LOGIN_RATE_LIMIT_REQUESTS: ${ADMIN_LOGIN_RATE_LIMIT_REQUESTS:-10}
  ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
  CANDIDATE_RATE_LIMIT_REQUESTS: ${CANDIDATE_RATE_LIMIT_REQUESTS:-5}
  CANDIDATE_RATE_LIMIT_WINDOW_SECONDS: ${CANDIDATE_RATE_LIMIT_WINDOW_SECONDS:-900}
  HOME: /tmp
  TMPDIR: /tmp
  XDG_CACHE_HOME: /tmp/.cache

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-astrea}
  POSTGRES_USER: ${POSTGRES_USER:-astrea}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-ops-env: &ops-env
  <<: *db-env
  ASTREA_BACKUP_ROOT: /backups
  PRIVATE_MEDIA_ROOT: /var/lib/astrea/private
  HOME: /tmp
  TMPDIR: /tmp
  XDG_CACHE_HOME: /tmp/.cache

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
    volumes:
      - astrea-postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    build:
      context: ./ops
      dockerfile: Dockerfile
    profiles:
      - ops
    environment:
      <<: *ops-env
      ASTREA_BACKUP_ID: ${ASTREA_BACKUP_ID:-}
      ASTREA_BACKUP_QUIESCED: ${ASTREA_BACKUP_QUIESCED:-}
    volumes:
      - ${ASTREA_BACKUP_ROOT:-../backups}:/backups
      - astrea-private-media:/var/lib/astrea/private:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    entrypoint: ["/usr/local/bin/backup.sh"]
    restart: "no"

  email-worker:
    build: *backend-build
    profiles:
      - ops
    command: ["python", "-m", "app.cli", "process-email-outbox"]
    environment:
      <<: *backend-env
      EMAIL_OUTBOX_BATCH_SIZE: ${EMAIL_OUTBOX_BATCH_SIZE:-10}
      EMAIL_OUTBOX_MAX_ATTEMPTS: ${EMAIL_OUTBOX_MAX_ATTEMPTS:-5}
      EMAIL_OUTBOX_RETRY_BASE_SECONDS: ${EMAIL_OUTBOX_RETRY_BASE_SECONDS:-60}
      EMAIL_OUTBOX_RETRY_MAX_SECONDS: ${EMAIL_OUTBOX_RETRY_MAX_SECONDS:-3600}
      EMAIL_OUTBOX_PROCESSING_TIMEOUT_SECONDS: ${EMAIL_OUTBOX_PROCESSING_TIMEOUT_SECONDS:-900}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      APPLICATION_NOTIFICATION_EMAIL: ${APPLICATION_NOTIFICATION_EMAIL:-info@mason-astrea.ru}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      SITE_BASE_URL: ${SITE_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - mail-egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    restart: "no"

  smtp-check:
    build: *backend-build
    profiles:
      - ops
    command: ["python", "-m", "app.cli", "check-smtp"]
    environment:
      <<: *backend-env
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      APPLICATION_NOTIFICATION_EMAIL: ${APPLICATION_NOTIFICATION_EMAIL:-info@mason-astrea.ru}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      SITE_BASE_URL: ${SITE_BASE_URL:-}
    networks:
      - mail-egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    restart: "no"

  prune:
    build:
      context: ./ops
      dockerfile: Dockerfile
    profiles:
      - ops
    command: ["/usr/local/bin/prune.sh"]
    environment:
      ASTREA_BACKUP_ROOT: /backups
      ASTREA_PRUNE_CONFIRM: ${ASTREA_PRUNE_CONFIRM:-}
      ASTREA_PRUNE_DRY_RUN: ${ASTREA_PRUNE_DRY_RUN:-true}
      ASTREA_BACKUP_RETENTION_COUNT: ${ASTREA_BACKUP_RETENTION_COUNT:-14}
      HOME: /tmp
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    volumes:
      - ${ASTREA_BACKUP_ROOT:-../backups}:/backups
    restart: "no"

  restore:
    build:
      context: ./ops
      dockerfile: Dockerfile
    profiles:
      - ops
    environment:
      <<: *ops-env
      ASTREA_RESTORE_CONFIRM: ${ASTREA_RESTORE_CONFIRM:-}
      ASTREA_RESTORE_QUIESCED: ${ASTREA_RESTORE_QUIESCED:-}
      ASTREA_BACKUP_ID: ${ASTREA_BACKUP_ID:-}
    volumes:
      - ${ASTREA_BACKUP_ROOT:-../backups}:/backups:ro
      - astrea-private-media:/var/lib/astrea/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    entrypoint: ["/usr/local/bin/restore.sh"]
    restart: "no"

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
    restart: "no"

  backend:
    build: *backend-build
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "${ASTREA_PROXY_IP:-172.30.250.10}",
      ]
    environment:
      <<: *backend-env
    volumes:
      - astrea-private-media:/var/lib/astrea/private
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys; from urllib.request import urlopen; data=json.loads(urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read().decode()); sys.exit(0 if data.get('status') == 'ok' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_CANDIDATE_FORM_ENABLED: ${VITE_CANDIDATE_FORM_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: ${ASTREA_PROXY_IP:-172.30.250.10}
    ports:
      - "127.0.0.1:${ASTREA_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  astrea-postgres-data:
  astrea-private-media:

networks:
  edge:
    ipam:
      config:
        - subnet: ${ASTREA_EDGE_SUBNET:-172.30.250.0/24}
  data:
    internal: true
  mail-egress: {}
