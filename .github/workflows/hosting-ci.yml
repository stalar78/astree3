name: Hosting CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosting-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosting-mysql:
    name: HOSTING MySQL
    runs-on: ubuntu-latest
    env:
      ASTREA_HOSTING_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=astrea_hosting_ci;charset=utf8mb4
      ASTREA_HOSTING_DB_USER: astrea_ci
      ASTREA_HOSTING_DB_PASSWORD: astrea_ci
      MYSQL_PWD: astrea_ci

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: astrea_hosting_ci
          MYSQL_USER: astrea_ci
          MYSQL_PASSWORD: astrea_ci
          MYSQL_ROOT_PASSWORD: astrea_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pastrea_root_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: PHP syntax
        run: find hosting/api hosting/config hosting/editor hosting/scripts hosting/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Apply HOSTING schema twice
        run: |
          mysql -h127.0.0.1 -uastrea_ci astrea_hosting_ci < hosting/db/001_initial.sql
          mysql -h127.0.0.1 -uastrea_ci astrea_hosting_ci < hosting/db/002_editor_auth.sql
          mysql -h127.0.0.1 -uastrea_ci astrea_hosting_ci < hosting/db/001_initial.sql
          mysql -h127.0.0.1 -uastrea_ci astrea_hosting_ci < hosting/db/002_editor_auth.sql

      - name: Verify schema seed
        run: |
          page_count="$(mysql -N -B -h127.0.0.1 -uastrea_ci astrea_hosting_ci -e 'SELECT COUNT(*) FROM pages')"
          migration_001_count="$(mysql -N -B -h127.0.0.1 -uastrea_ci astrea_hosting_ci -e "SELECT COUNT(*) FROM hosting_schema_migrations WHERE version = '001_initial'")"
          migration_002_count="$(mysql -N -B -h127.0.0.1 -uastrea_ci astrea_hosting_ci -e "SELECT COUNT(*) FROM hosting_schema_migrations WHERE version = '002_editor_auth'")"
          editor_count="$(mysql -N -B -h127.0.0.1 -uastrea_ci astrea_hosting_ci -e 'SELECT COUNT(*) FROM editor_users')"
          test "$page_count" = "6"
          test "$migration_001_count" = "1"
          test "$migration_002_count" = "1"
          test "$editor_count" = "0"

      - name: Verify published-only public contracts
        run: php hosting/tests/public_content_contract.php

      - name: Verify Lite Editor auth contracts
        run: php hosting/tests/editor_auth_contract.php

      - name: Verify Lite Editor content contracts
        run: php hosting/tests/editor_content_contract.php

      - name: Verify one-time editor bootstrap
        run: |
          printf '%s' 'ci-editor-password-123456' | php hosting/scripts/bootstrap-editor.php ciadmin
          editor_count="$(mysql -N -B -h127.0.0.1 -uastrea_ci astrea_hosting_ci -e 'SELECT COUNT(*) FROM editor_users')"
          test "$editor_count" = "1"
          ! printf '%s' 'another-ci-password-123456' | php hosting/scripts/bootstrap-editor.php ciadmin2

      - name: Candidate endpoint remains absent
        run: |
          ! grep -R -n -E 'candidate-applications|candidate_applications' hosting/api hosting/db hosting/editor

  hosting-package:
    name: HOSTING Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build and validate HOSTING package
        run: node hosting/scripts/build-package.mjs --origin=https://hosting-ci.example

      - name: Verify packaged capability preflight
        run: php hosting/release/astrea-hosting/private/scripts/preflight.php

      - name: Verify public/private package boundary
        run: |
          test -f hosting/release/astrea-hosting/public/index.html
          test -f hosting/release/astrea-hosting/public/.htaccess
          test -f hosting/release/astrea-hosting/public/api/index.php
          test -f hosting/release/astrea-hosting/public/editor/index.php
          test -f hosting/release/astrea-hosting/private/config/config.local.php.example
          test -f hosting/release/astrea-hosting/private/db/001_initial.sql
          test -f hosting/release/astrea-hosting/private/scripts/bootstrap-editor.php
          test ! -e hosting/release/astrea-hosting/public/config
          test ! -e hosting/release/astrea-hosting/public/private
          test ! -e hosting/release/astrea-hosting/private/config/config.local.php
          grep -q 'https://hosting-ci.example/' hosting/release/astrea-hosting/public/sitemap.xml
          grep -q 'Sitemap: https://hosting-ci.example/sitemap.xml' hosting/release/astrea-hosting/public/robots.txt
          grep -q '"public_indexing": true' hosting/release/astrea-hosting/manifest.json
          grep -q '"candidate_intake": false' hosting/release/astrea-hosting/manifest.json

      - name: Build and verify transitional noindex package
        run: |
          node hosting/scripts/build-package.mjs --origin=https://hosting-ci.example --noindex
          test ! -e hosting/release/astrea-hosting/public/sitemap.xml
          grep -q '^Disallow: /$' hosting/release/astrea-hosting/public/robots.txt
          ! grep -q '^Sitemap:' hosting/release/astrea-hosting/public/robots.txt
          grep -q '"public_indexing": false' hosting/release/astrea-hosting/manifest.json
