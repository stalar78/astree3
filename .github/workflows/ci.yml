name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate deployment config
        run: |
          bash -n ../.devcontainer/demo.sh
          python -m json.tool ../.devcontainer/devcontainer.json >/dev/null
          sh -n ../infra/host/*.sh ../infra/ops/*.sh
          docker compose --env-file ../infra/.env.example -f ../infra/compose.yml config -q
          docker compose --profile ops --env-file ../infra/.env.example -f ../infra/compose.yml config -q

          cp ../infra/production.env.example /tmp/astrea-production-ci.env
          sed -i \
            -e 's|^POSTGRES_PASSWORD=.*$|POSTGRES_PASSWORD=ci-production-database-password-123456789|' \
            -e 's|^ADMIN_INITIAL_USERNAME=.*$|ADMIN_INITIAL_USERNAME=ciadmin|' \
            -e 's|^ADMIN_INITIAL_PASSWORD=.*$|ADMIN_INITIAL_PASSWORD=ci-production-admin-password-123456789|' \
            -e 's|^VITE_PUBLIC_SITE_ORIGIN=.*$|VITE_PUBLIC_SITE_ORIGIN=https://example.com|' \
            -e 's|^SITE_BASE_URL=.*$|SITE_BASE_URL=https://example.com|' \
            /tmp/astrea-production-ci.env
          sudo chown root:root /tmp/astrea-production-ci.env
          sudo chmod 0600 /tmp/astrea-production-ci.env
          sudo sh ../infra/host/production-preflight.sh "$GITHUB_WORKSPACE" /tmp/astrea-production-ci.env
          sudo rm -f /tmp/astrea-production-ci.env

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://astrea_ci:astrea_ci@127.0.0.1:5432/astrea_ci

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: astrea_ci
          POSTGRES_USER: astrea_ci
          POSTGRES_PASSWORD: astrea_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrea_ci -d astrea_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Migrate clean PostgreSQL database
        run: alembic upgrade head

      - name: Verify migration head and managed-page seed
        run: |
          python - <<'PY'
          import os

          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          expected_pages = [
              ("about", "О ложе", "Материал ожидает утвержденного содержания.", False),
              ("contacts", "Контакты", "Материал ожидает утвержденного содержания.", False),
              ("faq", "FAQ", "Материал ожидает утвержденного содержания.", False),
              ("lodges_spb", "Ложи Санкт-Петербурга", "Материал ожидает утвержденного содержания.", False),
              ("materials", "Материалы", "Материал ожидает утвержденного содержания.", False),
              ("principles", "Цели и принципы", "Материал ожидает утвержденного содержания.", False),
          ]

          script_head = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          engine = create_engine(os.environ["DATABASE_URL"])

          with engine.connect() as connection:
            database_head = connection.execute(
                text("SELECT version_num FROM alembic_version")
            ).scalar_one()
            pages = [
                tuple(row)
                for row in connection.execute(
                    text(
                        "SELECT key, title, content, is_published "
                        "FROM pages ORDER BY key"
                    )
                )
            ]

          assert database_head == script_head, (
              f"database revision {database_head!r} does not match Alembic head {script_head!r}"
          )
          assert pages == expected_pages, f"unexpected predefined pages: {pages!r}"
          print(f"PostgreSQL integration verified at Alembic head {database_head}.")
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate production sitemap generation
        run: |
          test ! -e dist/sitemap.xml
          VITE_PUBLIC_SITE_ORIGIN=https://example.com npm run generate-sitemap
          test -f dist/sitemap.xml
          grep -Fq '<loc>https://example.com/</loc>' dist/sitemap.xml
          grep -Fq '<loc>https://example.com/novosti</loc>' dist/sitemap.xml
          grep -Fq 'Sitemap: https://example.com/sitemap.xml' dist/robots.txt
          ! grep -Fq '/admin' dist/sitemap.xml
          ! grep -Fq '/api/' dist/sitemap.xml
          ! grep -Fq '/o-lozhe' dist/sitemap.xml
          VITE_PUBLIC_SITE_ORIGIN=http://example.com npm run generate-sitemap
          test ! -e dist/sitemap.xml
          ! grep -Fq '^Sitemap:' dist/robots.txt

      - name: Validate Nginx runtime template
        run: |
          docker build -t astrea-frontend-ci .
          docker run --rm --add-host backend:127.0.0.1 -e ASTREA_HOST_PROXY_IP=172.30.250.1 astrea-frontend-ci nginx -t
          docker run --rm --add-host backend:127.0.0.1 -e ASTREA_HOST_PROXY_IP=172.30.250.1 astrea-frontend-ci nginx -T 2>&1 | grep -F "set_real_ip_from 172.30.250.1;"
          docker run --rm --add-host backend:127.0.0.1 -e ASTREA_HOST_PROXY_IP=172.30.250.1 astrea-frontend-ci nginx -T 2>&1 | grep -F 'proxy_set_header X-Forwarded-Proto $astrea_forwarded_proto;'
